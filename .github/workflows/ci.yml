name: CI

on:
  push:
    branches: ['arena/**', main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      evidence_run:
        description: 'Read only: surface existing desktop-smoke JSON from this repository run (no build)'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-evidence:
    name: Read existing desktop gate evidence (no build)
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.evidence_run != '')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Select previous failed push (read only)
        id: prior
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_RUN: ${{ inputs.evidence_run }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_RUN" ]; then
            run="$REQUESTED_RUN"
          else
            run="$(gh run list --workflow ci.yml --event push --branch "$GITHUB_REF_NAME" --status failure --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          if [[ -n "$run" && ! "$run" =~ ^[0-9]+$ ]]; then
            echo '::error::Invalid prior evidence run ID'
            exit 1
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Download existing structured smoke evidence
        if: steps.prior.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.prior.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: '*desktop*smoke'
          path: ${{ runner.temp }}/desktop-evidence
      - name: Expose bounded test-only JSON in check annotations
        if: steps.prior.outputs.run != ''
        shell: python
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/desktop-evidence
        run: |
          import json, os
          from pathlib import Path
          found = 0
          for path in Path(os.environ['EVIDENCE_DIR']).rglob('*.json'):
              if path.name not in {'installed.json', 'smoke.json', 'webview.json'}:
                  continue
              if path.stat().st_size > 65536:
                  raise SystemExit('Unexpected oversized structured smoke evidence')
              body = json.loads(path.read_text(encoding='utf-8-sig'))
              report = {'artifact': path.parent.name, 'evidence': body}
              message = json.dumps(report, ensure_ascii=True, separators=(',', ':'))
              print('::notice title=Existing desktop evidence::' + message.replace('%', '%25'))
              found += 1
          if found == 0:
              print('::notice::No desktop smoke JSON in the selected failed run; no product acceptance inferred')

  backend:
    if: inputs.evidence_run == ''
    name: Backend — lint + tests (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: ruff (select ALL)
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .
      - name: pytest + coverage (>=80%)
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: pip-audit
        run: pip-audit -r requirements.txt --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    if: inputs.evidence_run == ''
    name: Frontend — lint + tests + build (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  security:
    if: inputs.evidence_run == ''
    name: Security — gitleaks + trivy fs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Use the MIT CLI, not the separately licensed gitleaks-action wrapper.
      - name: Install checksum-pinned gitleaks CLI
        shell: bash
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Verify exact public-checksum exception boundaries
        run: python scripts/ci/gitleaks-exception-test.py "${{ runner.temp }}/gitleaks"
      - name: gitleaks full history (redacted)
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks" git . --redact=100 --report-format=sarif --report-path=results.sarif --exit-code=2'
      - name: Report secret-finding locations without values
        if: always()
        run: python scripts/ci/gitleaks-locations.py
      - name: Upload redacted secret scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results.sarif
          path: results.sarif
          if-no-files-found: ignore
      - name: trivy filesystem (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  installer:
    name: Installer — Windows NSIS build
    if: inputs.evidence_run == '' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: C:\build
    steps:
      # The repository name ends with a dot and Win32 strips trailing dots from folder
      # names, so the runner cannot create its default workspace. Clone into C:\build.
      - name: Clone into a Windows-safe directory
        shell: pwsh
        working-directory: C:\
        run: |
          New-Item -ItemType Directory -Force C:\build | Out-Null
          git clone --depth 1 --branch $env:GITHUB_REF_NAME "https://github.com/$env:GITHUB_REPOSITORY.git" C:\build
          if ($LASTEXITCODE -ne 0) { throw "git clone failed with exit code $LASTEXITCODE" }
          git -C C:\build fetch --depth 1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "git fetch of triggering revision failed" }
          git -C C:\build reset --hard $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "git reset to triggering revision failed" }
      - name: Probe pinned LGPL shared tools on Windows (build machine only)
        shell: pwsh
        run: ./scripts/ci/windows-native-media.ps1 -OutputDir "${{ runner.temp }}/ce-native-media"
      - name: Upload native tool probe evidence (no media or binaries)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-media-probe
          path: ${{ runner.temp }}/ce-native-media/probe.json
          if-no-files-found: warn
      - name: Validate Windows PowerShell harness syntax
        shell: pwsh
        run: |
          foreach ($file in (Get-ChildItem scripts -Filter '*.ps1' -Recurse)) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Compute cargo cache key outside the default checkout
        id: cargo-key
        shell: pwsh
        run: |
          $compiler = (& rustc -V) -replace '[^a-zA-Z0-9.-]', '-'
          $manifest = (Get-FileHash src-tauri/Cargo.toml -Algorithm SHA256).Hash
          $tests = (Get-FileHash scripts/ci/readiness-contract/Cargo.toml -Algorithm SHA256).Hash
          "key=cargo-win-$compiler-$manifest-$tests" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Restore cargo
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            C:\build\src-tauri\target
            C:\build\scripts\ci\readiness-contract\target
          key: ${{ steps.cargo-key.outputs.key }}
          restore-keys: cargo-
      - name: Build installer (light build, no pinned FFmpeg/models)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & pwsh -NoProfile -File C:\build\scripts\build-installer.ps1 -WithoutPinnedBinaries *>&1 |
            Tee-Object -FilePath C:\build\build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content C:\build\build.log -Tail 80 | ForEach-Object { Write-Host $_ }
            Write-Output "::error::installer build failed with exit code $LASTEXITCODE"
            exit 1
          }
          exit 0
      # Save a successful compilation BEFORE installed-runtime tests: a useful
      # failing acceptance gate must not force a full dependency rebuild next loop.
      - name: Save successfully built cargo graph
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            C:\build\src-tauri\target
            C:\build\scripts\ci\readiness-contract\target
          key: ${{ steps.cargo-key.outputs.key }}
      - name: Frozen sidecar same-origin resource smoke (no Vite)
        shell: pwsh
        run: |
          python scripts/ci/desktop-sidecar-smoke.py --executable backend/dist/cutting-edge-backend/cutting-edge-backend.exe --home src-tauri/target/release --output "${{ runner.temp }}/ce-desktop-smoke"
          if ($LASTEXITCODE -ne 0) { throw 'Frozen desktop transport/resource gate failed.' }
      - name: Upload frozen desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-sidecar-smoke
          path: ${{ runner.temp }}/ce-desktop-smoke
          if-no-files-found: warn
      - name: Provision test-only WebView CDP client (no browser/runtime download)
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/ce-webview-tools" --ignore-scripts --no-audit --no-fund playwright-core@1.64.1
          if ($LASTEXITCODE -ne 0) { throw 'Temporary CDP test tool installation failed.' }
      - name: Install and launch native desktop; verify orderly owned-process exit
        shell: pwsh
        run: ./scripts/ci/windows-installed-desktop.ps1 -OutputDir "${{ runner.temp }}/ce-installed-desktop" -AllowMachineCdpPolicy
      - name: Upload installed native desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-native-desktop-smoke
          path: ${{ runner.temp }}/ce-installed-desktop
          if-no-files-found: warn
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-build-log
          path: C:\build\build.log
      - uses: actions/upload-artifact@v4
        with:
          name: CuttingEdgeV2-Setup
          if-no-files-found: error
          path: |
            C:\build\delivery\*.exe
            C:\build\delivery\*.sha256
