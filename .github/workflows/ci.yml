name: CI

on:
  push:
    branches: ['arena/**', main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      evidence_run:
        description: 'Read only: surface existing desktop-smoke JSON from this repository run (no build)'
        required: false
        default: ''
      publish_release:
        description: 'Tag to publish the built installer under (e.g. v1.0.0-light). Empty = do not publish.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-evidence:
    name: Read existing desktop gate evidence (no build)
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.evidence_run != '')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Select previous failed push (read only)
        id: prior
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_RUN: ${{ inputs.evidence_run }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_RUN" ]; then
            run="$REQUESTED_RUN"
          else
            run="$(gh run list --workflow ci.yml --event push --branch "$GITHUB_REF_NAME" --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          if [[ -n "$run" && ! "$run" =~ ^[0-9]+$ ]]; then
            echo '::error::Invalid prior evidence run ID'
            exit 1
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Download existing structured smoke evidence
        if: steps.prior.outputs.run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ steps.prior.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: '*desktop*smoke'
          path: ${{ runner.temp }}/desktop-evidence
      - name: Expose bounded test-only JSON in check annotations
        if: steps.prior.outputs.run != ''
        shell: python
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/desktop-evidence
          SOURCE_RUN: ${{ steps.prior.outputs.run }}
        run: |
          import base64, json, os
          from pathlib import Path
          found = 0
          for path in Path(os.environ['EVIDENCE_DIR']).rglob('*.json'):
              if path.name not in {'installed.json', 'smoke.json', 'webview.json'}:
                  continue
              if path.stat().st_size > 65536:
                  raise SystemExit('Unexpected oversized structured smoke evidence')
              body = json.loads(path.read_text(encoding='utf-8-sig'))
              # Standard base64 avoids GitHub rewriting ANSI/control escapes in JSON errors.
              payload = base64.b64encode(json.dumps(body, ensure_ascii=True).encode()).decode()
              if len(payload) > 60000:
                  raise SystemExit('Encoded JSON exceeds bounded annotation transport; use original artifact')
              report = {'artifact': path.parent.name, 'source_run': os.environ['SOURCE_RUN'], 'file': path.name, 'encoding': 'base64-json', 'data': payload}
              message = json.dumps(report, ensure_ascii=True, separators=(',', ':'))
              print('::notice title=Existing desktop evidence::' + message.replace('%', '%25'))
              found += 1
          if found == 0:
              print('::notice::No desktop smoke JSON in the selected failed run; no product acceptance inferred')
      - name: Expose bounded test-only native screenshot metadata
        if: steps.prior.outputs.run != ''
        shell: python
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/desktop-evidence
          SOURCE_RUN: ${{ steps.prior.outputs.run }}
        run: |
          import hashlib, json, os
          from pathlib import Path
          for path in Path(os.environ['EVIDENCE_DIR']).rglob('installed-webview-fa.png'):
              if path.parent.name != 'installed-native-desktop-smoke':
                  continue
              if path.stat().st_size > 384000:
                  raise SystemExit('Native screenshot exceeds bounded annotation transport; use original artifact')
              data = path.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              report = {'source_run': os.environ['SOURCE_RUN'], 'file': path.name, 'artifact': path.parent.name, 'bytes': len(data), 'sha256': sha, 'note': 'Annotation image transport limited to ~4k per notice; download artifact for actual PNG'}
              print('::notice title=Existing native screenshot metadata::' + json.dumps(report, separators=(',', ':')))

  backend:
    if: inputs.evidence_run == ''
    name: Backend — lint + tests (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: ruff (select ALL)
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy — type check (honest, non-strict)
        run: python -m mypy app
      - name: pytest + coverage (>=80%)
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: pip-audit
        run: pip-audit -r requirements.txt --strict
      - name: ffmpeg smoke (real binary — not just argv)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -version
          # Project policy is LGPL-only: libx264 is GPL and never shipped (FORBIDDEN_ENCODERS).
          # Smoke with an encoder the product can actually use, falling back to mpeg4.
          ENC=$(ffmpeg -hide_banner -encoders 2>/dev/null | grep -q ' libopenh264 ' && echo libopenh264 || echo mpeg4)
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc=duration=1:size=128x128:rate=30 \
            -f lavfi -i sine=frequency=440:duration=1 -frames:v 30 -c:v "$ENC" -c:a aac -pix_fmt yuv420p /tmp/smoke.mp4
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 /tmp/smoke.mp4 | grep -q '^audio$'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  arch:
    if: inputs.evidence_run == ''
    name: Arch — cohesion guardrail (Madge + arch tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Madge — no circular JS/TS deps
        run: npx --yes madge --circular --extensions js,ts,tsx frontend/src
      - name: Dependency Cruiser — validate arch rules
        run: NODE_PATH=frontend/node_modules npx --yes dependency-cruiser --config .dependency-cruiser.cjs frontend/src --output-type err
        env:
          NODE_PATH: frontend/node_modules
      # `frontend-features-isolation` is a warn-level rule, so it never failed the build
      # and the count silently grew to 18. Cross-feature stores now live in src/store/;
      # the single remaining warning is the Style Match wizard composing RenderPanel.
      # This ratchet fails the build if that count ever increases again.
      - name: Dependency Cruiser — warning ratchet (budget 1)
        run: |
          BUDGET=1
          COUNT=$(NODE_PATH=frontend/node_modules npx --yes dependency-cruiser \
            --config .dependency-cruiser.cjs frontend/src --output-type err 2>&1 \
            | grep -c '^  warn ' || true)
          echo "feature-isolation warnings: $COUNT (budget $BUDGET)"
          if [ "$COUNT" -gt "$BUDGET" ]; then
            echo "::error::dependency-cruiser warnings rose to $COUNT (budget $BUDGET)."
            echo "Put state shared by two features in frontend/src/store/, not in a sibling feature folder."
            exit 1
          fi
          if [ "$COUNT" -lt "$BUDGET" ]; then
            echo "::notice::warnings dropped to $COUNT — lower BUDGET in .github/workflows/ci.yml to lock it in."
          fi
        env:
          NODE_PATH: frontend/node_modules
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: pytest-archon — backend layer checks
        run: python -m pytest tests/test_arch.py -v
        working-directory: backend

  rust:
    if: inputs.evidence_run == ''
    name: Desktop shell — Rust lint + tests (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # src-tauri was previously compiled only by the Windows installer job, which does
      # not run on pull_request. Its unit tests had therefore never executed in CI.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - name: Record whether Cargo.lock is committed
        id: lockfile
        run: |
          if [ -f src-tauri/Cargo.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning file=src-tauri/Cargo.toml::src-tauri/Cargo.lock is missing; \
            resolving crates fresh so clippy and tests can still run. This job fails at the end."
            cd src-tauri && cargo generate-lockfile
          fi
      - name: Tauri v2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev librsvg2-dev patchelf
      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: src-tauri
      - name: cargo test
        run: cargo test --locked
        working-directory: src-tauri
      # Formatting runs after the checks that can actually break the product. As a
      # first gate it aborted the job before clippy and the tests ever ran, hiding
      # the signal that matters behind a whitespace diff.
      - name: cargo fmt --check
        if: always()
        run: cargo fmt --all --check
        working-directory: src-tauri
      # Runs last so the checks above still publish results, but the job is red until
      # the lockfile is committed: without it the shipped installer is not reproducible.
      - name: Cargo.lock must be committed (reproducible installer)
        if: always() && steps.lockfile.outputs.present == 'false'
        run: |
          echo "::error file=src-tauri/Cargo.toml::src-tauri/Cargo.lock is not committed."
          echo "Rust is the only ecosystem in this repo without a lockfile, so every"
          echo "installer build resolves crate versions afresh and is not reproducible."
          echo "Fix: cd src-tauri && cargo generate-lockfile && git add Cargo.lock"
          exit 1

  frontend:
    if: inputs.evidence_run == ''
    name: Frontend — lint + tests + build (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: npm audit (moderate+, prod only — 8 dev-only moderate known)
        run: npm audit --omit=dev --audit-level=moderate

  security:
    if: inputs.evidence_run == ''
    name: Security — gitleaks + trivy fs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Use the MIT CLI, not the separately licensed gitleaks-action wrapper.
      - name: Install checksum-pinned gitleaks CLI
        shell: bash
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Verify exact public-checksum exception boundaries
        run: python scripts/ci/gitleaks-exception-test.py "${{ runner.temp }}/gitleaks"
      - name: gitleaks full history (redacted)
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks" git . --redact=100 --report-format=sarif --report-path=results.sarif --exit-code=2'
      - name: Report secret-finding locations without values
        if: always()
        run: python scripts/ci/gitleaks-locations.py
      - name: Upload redacted secret scan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-results.sarif
          path: results.sarif
          if-no-files-found: ignore
      - name: trivy filesystem (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

  installer:
    name: Installer — Windows NSIS build
    if: inputs.evidence_run == '' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: C:\build
    steps:
      # The repository name ends with a dot and Win32 strips trailing dots from folder
      # names, so the runner cannot create its default workspace. Clone into C:\build.
      - name: Clone into a Windows-safe directory
        shell: pwsh
        working-directory: C:\
        run: |
          New-Item -ItemType Directory -Force C:\build | Out-Null
          git clone --depth 1 --branch $env:GITHUB_REF_NAME "https://github.com/$env:GITHUB_REPOSITORY.git" C:\build
          if ($LASTEXITCODE -ne 0) { throw "git clone failed with exit code $LASTEXITCODE" }
          git -C C:\build fetch --depth 1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "git fetch of triggering revision failed" }
          git -C C:\build reset --hard $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "git reset to triggering revision failed" }
      - name: Probe pinned LGPL shared tools on Windows (build machine only)
        shell: pwsh
        run: ./scripts/ci/windows-native-media.ps1 -OutputDir "${{ runner.temp }}/ce-native-media"
      - name: Upload native tool probe evidence (no media or binaries)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-native-media-probe
          path: ${{ runner.temp }}/ce-native-media/probe.json
          if-no-files-found: warn
      - name: Validate Windows PowerShell harness syntax
        shell: pwsh
        run: |
          foreach ($file in (Get-ChildItem scripts -Filter '*.ps1' -Recurse)) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Invalid artifact pins fail before files or downloads
        shell: pwsh
        run: ./scripts/ci/windows-pin-guards.ps1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Rust cache (cargo registry + target, OSS)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            C:\build\src-tauri -> target
            C:\build\scripts\ci\readiness-contract -> target
          cache-all-crates: true
          save-if: ${{ github.event_name == 'push' }}
      - name: Build installer (light build, no pinned FFmpeg/models)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & pwsh -NoProfile -File C:\build\scripts\build-installer.ps1 -WithoutPinnedBinaries *>&1 |
            Tee-Object -FilePath C:\build\build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content C:\build\build.log -Tail 80 | ForEach-Object { Write-Host $_ }
            Write-Output "::error::installer build failed with exit code $LASTEXITCODE"
            exit 1
          }
          exit 0
      # Rust cache via Swatinem/rust-cache automatically saves on push; no manual save step needed.
      - name: Frozen sidecar same-origin resource smoke (no Vite)
        shell: pwsh
        run: |
          python scripts/ci/desktop-sidecar-smoke.py --executable backend/dist/cutting-edge-backend/cutting-edge-backend.exe --home src-tauri/target/release --output "${{ runner.temp }}/ce-desktop-smoke"
          if ($LASTEXITCODE -ne 0) { throw 'Frozen desktop transport/resource gate failed.' }
      - name: Upload frozen desktop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-sidecar-smoke
          path: ${{ runner.temp }}/ce-desktop-smoke
          if-no-files-found: warn
      - name: Provision test-only WebView CDP client (no browser/runtime download)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/ce-webview-tools" | Out-Null
          Copy-Item -Path "C:\build\scripts\ci\webview-tools\package.json" -Destination "$env:RUNNER_TEMP/ce-webview-tools/package.json" -Force
          Copy-Item -Path "C:\build\scripts\ci\webview-tools\package-lock.json" -Destination "$env:RUNNER_TEMP/ce-webview-tools/package-lock.json" -Force
          npm ci --prefix "$env:RUNNER_TEMP/ce-webview-tools" --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Temporary CDP test tool installation failed.' }
      - name: Install and launch native desktop; verify orderly owned-process exit
        shell: pwsh
        run: ./scripts/ci/windows-installed-desktop.ps1 -OutputDir "${{ runner.temp }}/ce-installed-desktop" -AllowMachineCdpPolicy
      - name: Upload installed native desktop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-native-desktop-smoke
          path: ${{ runner.temp }}/ce-installed-desktop
          if-no-files-found: warn
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-build-log
          path: C:\build\build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CuttingEdgeV2-Setup
          if-no-files-found: error
          path: |
            C:\build\delivery\*.exe
            C:\build\delivery\*.sha256

  release:
    # Only on an explicit dispatch that names a tag, so the write permission is
    # never active on ordinary pushes. Reuses the artifact the installer job
    # already produced rather than building the app a second time.
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.evidence_run == '' && inputs.publish_release != '')
    name: Publish installer to a GitHub Release
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the installer built by this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.run_id }}" -R "${{ github.repository }}" -n CuttingEdgeV2-Setup -D dist
      - name: Show what will be published
        run: |
          ls -l dist
          test -n "$(find dist -name '*.exe' -print -quit)" || { echo "::error::no installer .exe in the artifact"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.publish_release }}
        run: |
          set -euo pipefail
          # The light build carries no FFmpeg or models; say so on the release itself
          # rather than letting someone discover it after downloading.
          notes=$(cat <<'NOTES'
          Windows installer built by CI from this commit.

          Staged setup: system requirements (x64, Windows build, AVX2, RAM, disk) ->
          install the bundled Visual C++ runtime if missing -> verify it registered ->
          install the application -> verify the installed payload. Progress is reported
          in a single details view. The installer performs no network access.

          **This is the `light` build.** FFmpeg and the analysis models are not embedded,
          because their SHA-256 pins in `scripts/pins.json` are still null. The app
          resolves FFmpeg from PATH in this configuration. Run
          `scripts/build-installer.ps1 -UpdatePins` on a trusted network and commit the
          pins to produce the full offline package.

          Verify the download against the published .sha256 before running.
          NOTES
          )
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* -R "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" dist/* -R "${{ github.repository }}" \
              --title "Cutting Edge v2 $TAG - Windows installer (light)" \
              --notes "$notes" \
              --target "${{ github.sha }}"
          fi
          echo "### Download" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" -R "${{ github.repository }}" \
            --json assets --jq '.assets[] | "- \(.name) (\(.size) bytes)\n  \(.url)"' >> "$GITHUB_STEP_SUMMARY"
