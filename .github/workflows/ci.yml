name: CI

on:
  push:
    branches: ['arena/**', main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint + tests (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: ruff (select ALL)
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .
      - name: pytest + coverage (>=80%)
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: pip-audit
        run: pip-audit -r requirements.txt --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend — lint + tests + build (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  security:
    name: Security — gitleaks + trivy fs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: trivy filesystem (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  installer:
    name: Installer — Windows NSIS build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
      - name: Build installer (light build, no pinned FFmpeg/models)
        shell: pwsh
        run: ./scripts/build-installer.ps1 -WithoutPinnedBinaries
      - uses: actions/upload-artifact@v4
        with:
          name: CuttingEdgeV2-Setup
          if-no-files-found: error
          path: |
            delivery/*.exe
            delivery/*.sha256
