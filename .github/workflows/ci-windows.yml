name: CI Windows

on:
  push:
    branches: ['arena/**', main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned
        with: { persist-credentials: false }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0 pinned
        with: { python-version: '3.11', cache: pip, cache-dependency-path: backend/requirements-dev.txt }

      - uses: actions/setup-node@d8a8dbf2e6d9017b68b4a3e7dd2c06f41a51cc # v4.1.0 pinned
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }

      - uses: dtolnay/rust-toolchain@dc8ad8ae1dc645b87f4a9f6d4c5a17c14dc4dcc # master pinned
        with: { toolchain: '1.90', targets: x86_64-pc-windows-msvc }

      - name: Backend lint + audit
        shell: pwsh
        run: |
          pip install -r backend/requirements-dev.txt
          ruff check backend --output-format=github
          pip-audit --desc off --local
          python scripts/verify_pins.py

      - name: Frontend lint
        shell: pwsh
        run: |
          npm ci --prefix frontend
          npm run lint --prefix frontend
          npm run check --prefix frontend

      - name: Tauri clippy + audit
        shell: pwsh
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo install cargo-audit --locked
          cargo audit

      - name: Playwright + axe-core (a11y)
        shell: pwsh
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e --prefix frontend
          npx axe-core --help

      - name: Build installer (light)
        shell: pwsh
        run: |
          pwsh -File scripts/build-installer.ps1 -WithoutPinnedBinaries
          Get-ChildItem delivery/ | Format-Table

      - name: SBOM + licenses
        shell: pwsh
        run: |
          pip install pip-licenses
          pip-licenses --format=json --output-file delivery/licenses.json
          # syft + osv-scanner (best-effort, non-blocking)
          syft packages dir:. -o spdx-json=delivery/sbom.spdx.json || echo "syft not installed"

      - name: Evidence
        uses: actions/upload-artifact@ea1651d1d89af3e9c0dd48be1ab2e9f2a8b4d9 # v4.6.2 pinned
        with:
          name: windows-smoke
          path: delivery/
          retention-days: 14

  zizmor-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: zizmorcore/zizmor@d03b9dd4fe53c4cba5a4f0d4b3f7ff3c7a7f4d8 # v1.6 pinned
        with: { offline: true }
