[package]
name = "cutting-edge-v2"
version = "1.0.0"
description = "Cutting Edge v2 — offline sports video editor"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

# main.rs calls this library by its Tauri convention name.
[lib]
name = "cutting_edge_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "=2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
