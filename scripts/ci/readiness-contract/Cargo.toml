[package]
name = "cutting-edge-readiness-contract"
version = "0.1.0"
edition = "2021"
publish = false

# Test the actual production module, not a duplicate, without recompiling the
# entire GUI dependency graph in Cargo's separate unwind-enabled test profile.
[lib]
path = "../../../src-tauri/src/readiness.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
