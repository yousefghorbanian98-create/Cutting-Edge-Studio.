# StyleMatch quality thresholds — objective + subjective (professor §3)
# Each metric is compared to fixtures in tests/fixtures/stylematch-golden/
version: 1
thresholds:
  asl_error_seconds: 0.25        # average shot length error vs ground truth
  wasserstein_color: 0.18        # Wasserstein on 64-bin HSV histogram
  delta_e_lab: 2.3               # Just-noticeable ΔE*ab (CIE76)
  beat_f1: 0.65                  # librosa beat tracker F1 vs annotated
  user_study_mean: 3.5           # 1-5 Likert, 5 users per style pack
  user_study_min_votes: 5

methods:
  # Synthetic fixtures: black bars -> 24.0s ASL, color bars -> known HSV
  synthetic:
    - name: asl
      fixture: fixtures/stylematch-golden/synthetic-3shots.mp4
      ground_truth: { asl: 1.0, shots: 3 }
    - name: color
      fixture: fixtures/stylematch-golden/color-bars.mp4
  # Real demo (10s, MIT licensed): manual annotated beats
  real:
    fixture: fixtures/stylematch-golden/demo-10s.mp4
    beats: [0.52, 1.04, 1.56, 2.08]

quality_report: reports/quality.json  # generated by tests/test_stylematch_quality.py
